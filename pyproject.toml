[tool.poetry]
name = "oxebot"
version = "0.1.0"
description = ""
authors = ["yzakius <dev@yzakius.me>"]

[tool.poetry.dependencies]
python = "^3.12"
python-decouple = "^3.4"
python-telegram-bot = "^22.7"
httpx = "^0.28.1"

[tool.poetry.dev-dependencies]
cryptography = "^37.0.4"

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
ruff = "^0.15.13"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

line-length = 88
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
